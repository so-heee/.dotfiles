[mgr]
show_hidden = true        # 隠しファイル(dotfiles等)を表示。. キーでトグル可
sort_by     = "natural"   # file2 / file10 を人間的な順で並べる
linemode    = "size"      # 各行に容量を表示

# git.yazi: ファイル一覧に Git ステータスを表示するための fetcher 登録
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"
