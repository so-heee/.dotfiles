onboarding = false
# Herdr 設定 — .config/tmux/.tmux.conf を参考に構築

[keys]
# ▼ prefix と分割キーはデフォルトから変更（他はデフォルトと同値の明示宣言）
prefix           = "ctrl+q"        # default: ctrl+b / tmux: set -g prefix C-q
split_vertical   = "prefix+backslash"  # default: prefix+v / WezTerm: LEADER + \  左右分割
copy_mode        = "prefix+v"      # 変更: default は prefix+[ / tmux: bind-key v copy-mode
# ▼ 以下はデフォルトと同値
new_tab          = "prefix+c"      # tmux: new-window (base-index 1)
next_tab         = "prefix+n"
previous_tab     = "prefix+p"
split_horizontal = "prefix+minus"  # pain-control: prefix + -  上下分割
focus_pane_left  = "prefix+h"      # vi風ペイン移動
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"
switch_tab       = "prefix+1..9"

# ▼ workspace 操作 — tab の prefix+c/n/p に対応する Shift 版で統一
new_workspace      = "prefix+shift+c"  # 変更: default は prefix+shift+n
next_workspace     = "prefix+shift+n"  # default: 未設定
previous_workspace = "prefix+shift+p"  # default: 未設定
rename_pane        = "prefix+shift+m"  # 変更: default は prefix+shift+p（previous_workspace に譲る）

# lazygit をポップアップ起動
[[keys.command]]
key         = "prefix+alt+g"
type        = "popup"
command     = "lazygit"
description = "run lazygit"
width       = "80%"
height      = "80%"

[theme]
name = "terminal"                  # WezTerm側の配色(color_scheme)に追従させる

[ui]
mouse_capture = true               # default と同値。false だと herdr のクリック/ホイール操作が効かなくなる
hide_tab_bar_when_single_tab = true  # default: false / タブが1つのワークスペースではタブ欄を隠す

# Spaces 表示: 1行目 = 状態アイコン + 状態テキスト + リポジトリ別アイコン（zsh の _herdr_repo_icon が送る）、2行目 = workspace 名
[ui.sidebar.spaces]
rows = [["state_icon", "state_text", "$repo_icon"], ["workspace"]]

# Agents 表示: 1行目 = 状態アイコン + 状態テキスト + エージェント別アイコン（zsh の claude/codex ラッパーが送る）、2行目 = 作業内容、3行目 = agent 名
[ui.sidebar.agents]
rows = [["state_icon", "state_text", "$agent_icon"], ["terminal_title_stripped"], ["agent"]]

# エージェント別にアイコン色を変える（claude = Anthropic オレンジ、codex = OpenAI グリーン）
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "state_text", { token = "$agent_icon", fg = "#D97757" }], ["terminal_title_stripped"], ["agent"]]
codex  = [["state_icon", "state_text", { token = "$agent_icon", fg = "#10A37F" }], ["terminal_title_stripped"], ["agent"]]

[ui.toast]
delivery = "herdr"                 # default: off / エージェント完了・要対応を herdr 内トーストで通知
