"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:b1)\
$os\
$username\
$directory\
[](bg:b2 fg:b1)\
$git_branch\
$git_commit\
$git_status\
$git_state\
[](bg:b3 fg:b2)\
$aws\
[](bg:b4 fg:b3)\
$golang\
$java\
$kotlin\
$lua\
$nodejs\
$php\
$python\
$ruby\
$rust\
$scala\
$terraform\
[](fg:b4)\
$fill\
[](fg:g3)\
$status\
[](bg:g3 fg:g2)\
$cmd_duration\
[](bg:g2 fg:g1)\
$time\
[](fg:g1)\
\n$character\
"""

# right_format = """
# $cmd_duration
# """

palette = 'soheee'

[os]
style = "bg:b1 fg:f1"
format = '[ $symbol]($style)'
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[directory]
style = "bg:b1 fg:f2"
format = "[ $path ]($style)"
truncation_length = 4
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = '   '
style = "bg:b2 fg:f2"
format = "[ $symbol$branch(:$remote_branch) ]($style)"

[git_commit]
style = "bg:b2 fg:f2"

[git_status]
style = "bg:b2 fg:f2"
format = '([\[$all_status$ahead_behind\] ]($style))'

[git_state]
style = "bg:b2 fg:f2"
format = '[\($state( $progress_current of $progress_total)\)]($style)'

[aws]
style = 'bg:b3 fg:f3'
symbol = "󰸏 "
format = '[ $symbol($profile) ]($style)'

[gcloud]
symbol = " "

[golang]
style = "bg:b4 fg:f4"
symbol = " "
format = "[ $symbol($version )]($style)"

[java]
style = "bg:b4 fg:f4"
symbol = " "
format = "[ $symbol($version )]($style)"

[kotlin]
style = "bg:b4 fg:f4"
symbol = " "
format = "[ $symbol($version )]($style)"

[lua]
style = "bg:b4 fg:f4"
symbol = " "
format = "[ $symbol($version )]($style)"

[nodejs]
style = "bg:b4 fg:f4"
symbol = " "
format = "[ $symbol($version )]($style)"

[php]
style = "bg:b4 fg:f4"
symbol = " "
format = "[ $symbol($version )]($style)"

[python]
style = "bg:b4 fg:f4"
symbol = " "
format = "[ $symbol($version )]($style)"

[ruby]
style = "bg:b4 fg:f4"
symbol = " "
format = "[ $symbol($version )]($style)"

[rust]
style = "bg:b4 fg:f4"
symbol = "󱘗 "
format = "[ $symbol($version )]($style)"

[scala]
style = "bg:b4 fg:f4"
symbol = " "
format = "[ $symbol($version )]($style)"

[terraform]
style = "bg:b4 fg:f4"
symbol = " "
format = "[ $symbol($version )]($style)"

[mise]
style = "bg:b4 fg:f4"
disabled = false

[fill]
symbol = '─'
style = 'gn'

[line_break]
disabled = false

[status]
style = "bg:g3"
format = '[ $symbol ]($style)'
symbol = '[✘](bg:g3 fg:red)'
success_symbol = '[✔](bg:g3 fg:green)'
not_executable_symbol = '[✘](bg:g3 fg:red)'
not_found_symbol = '[✘](bg:g3 fg:red)'
map_symbol = true
disabled = false

[cmd_duration]
min_time = 1
style = "bg:g2 fg:gf"
show_milliseconds = true
format = '[ 󰚭 $duration ]($style)'
disabled = false

[time]
time_format = "%T"
style = "bg:g1 fg:gf"
format = '[  $time ]($style)'
disabled = false

[character]
success_symbol = '[❯](green)'
error_symbol = '[❯](red)'
disabled = false

[palettes.soheee]
# 左側: night-owl accent（彩度を抑えたミュート版。文字は紺で可読）
b1 = '#87a3d4' # blue   : os / directory (スレートブルー)
b2 = '#addb67' # green  : git (Night Owl の柔らかい黄緑)
b3 = '#dd9a82' # orange : aws (ソフトなテラコッタ)
b4 = '#b59ace' # purple : languages (ミュートなモーブ)
f1 = '#011627' # 左テキスト(紺文字)
f2 = '#011627'
f3 = '#011627'
f4 = '#011627'
# 右側: night-owl 由来グレー主体（ダーク=暗い紺グレー＋明文字、red/green もテーマ色）
g1 = '#1d3b53' # selection : time bg（最も濃い）
g2 = '#3e5d75' # surface   : cmd_duration bg
g3 = '#5f7e97' # grey-blue : status bg（明るい側）
gf = '#d6deeb' # fg       : 右テキスト(明文字)
gn = '#637777' # comment  : neutral gray : fill（中央の ─ 線）
red = '#ef5350'   # danger  : status ✘ / error ❯
green = '#22da6e' # success : status ✔ / success ❯
